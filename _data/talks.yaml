# Snapshot of "Tim 'mithro' Ansell - Talks & Presentations" Google Sheet
# (10TQ8mG1LRhiOalG_pqrUbOVp3gcnPFxttuyLUHfe4eA), taken 2026-08-08, plus
# compiled 2023-2026 additions gathered from public sources in Aug 2026
# (see docs/talks-2023-2026-additions.csv). Pending Tim's review:
# entries with source: compiled.
#
# year: 0 means no year is known ("Undated" on the site).
# sort_date: derived machine-sortable key (see scripts note in README);
#   date's year must match the year field, else falls back to YYYY-07-01,
#   and undated entries get 0000-01-01.
# slides_embed: derived Google Slides /embed URL, regenerated by
#   scripts/enrich_talk_embeds.py — edit slides/slides_edit, not this.
# slides_short: hand-maintained canonical short URL for the deck
#   (wafer.space/<alias>) — preferred over bit.ly/mith.ro on /talks/.
# slides_pub: the deck's "Publish to the web" link (/d/e/2PACX-…/pub),
#   for decks published but not link-shared; scripts/deck_links.py
#   links visitors there first (optional; hand-maintained).
# slug: URL id (/talks/<slug>/); equals the short-link alias where one
#   exists. Reviewed in the talks sheets' Slug column (talks_sheet.py).
# talk_title: the talk's own title without event decorations.
# categories: keys from _data/talk_categories.yaml (one or more).
# series / venue: display names grouping repeat performances and
#   recurring venues for the hub statistics (optional).
# strips: true = export and show the slide film strip; imported from
#   the sheets' Strips column (talks_sheet.py import).
# highlight: 1..10 rank on /talks/highlights/, with a one-line blurb.

