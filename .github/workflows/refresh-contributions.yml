# Refresh Contributions Data
# Once a month, re-runs scripts/fetch_contributions.py and commits the
# updated _data/contributions.yaml straight to master, so /contributions/
# never drifts more than a month behind github.com.
#
# Staying alive: GitHub disables scheduled workflows in a public repo
# after 60 days without repository activity. Two things stop that from
# happening silently here:
#   1. Every run commits (snapshot_date changes even when the counts do
#      not), so the repo sees activity at least once a month.
#   2. Every run also re-enables this workflow through the API, the same
#      approach keepalive actions use.
# If a run fails, an issue labelled "contributions-refresh" is opened (or
# commented on, if one is already open) so the failure is visible.
name: Refresh Contributions Data

on:
  schedule:
    # 06:17 UTC on the 2nd of each month: the previous month is complete
    # in every time zone, and off the top of the hour when GitHub's
    # scheduler is busiest.
    - cron: '17 6 2 * *'
  workflow_dispatch:
    inputs:
      refresh_orgs:
        description: 'Refetch organisation counts for every year (takes ~30 minutes)'
        type: boolean
        default: false
      allow_drop:
        description: 'Accept the new data even if counts dropped sharply versus the committed file'
        type: boolean
        default: false

permissions:
  contents: write   # commit the refreshed data file
  actions: write    # re-enable this workflow (keepalive)
  issues: write     # report failures

concurrency:
  group: refresh-contributions
  cancel-in-progress: false

jobs:
  refresh:
    # Do not run on forks.
    if: github.repository == 'mithro/mithro.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Fetch contribution calendar
        run: |
          args=()
          if [ "${{ inputs.refresh_orgs }}" = "true" ]; then
            args+=(--refresh-orgs)
          fi
          uv run scripts/fetch_contributions.py "${args[@]}"

      - name: Check the new data
        env:
          ALLOW_DROP: ${{ inputs.allow_drop }}
        run: |
          git show HEAD:_data/contributions.yaml > "$RUNNER_TEMP/previous.yaml"
          uv run --with pyyaml python - "$RUNNER_TEMP/previous.yaml" <<'EOF'
          import datetime, os, sys, yaml
          today = datetime.date.today()
          d = yaml.safe_load(open("_data/contributions.yaml"))
          old = yaml.safe_load(open(sys.argv[1]))

          # Shape: the file is complete and current. (A manual run that
          # starts just before midnight UTC can be stamped the day before.)
          snap = datetime.date.fromisoformat(str(d["snapshot_date"]))
          assert (today - snap).days in (0, 1), d["snapshot_date"]
          assert d["last_year"] == snap.year, d["last_year"]
          assert len(d["years"]) >= 10, f"only {len(d['years'])} years"
          assert d["total"] > 0

          # Regression: well-formed but wrong data (for example a degraded
          # page served to a CI runner) must not replace good history.
          # Contributions only grow, so any year or the all-time total
          # dropping sharply, or a year losing its organisations, means
          # the fetch went wrong.
          problems = []
          if d["total"] < old["total"] * 0.95:
              problems.append(f"all-time total fell from {old['total']} to {d['total']}")
          new_years = {y["year"]: y for y in d["years"]}
          for y in old["years"]:
              new = new_years.get(y["year"])
              if new is None:
                  problems.append(f"{y['year']} is missing")
                  continue
              if new["total"] < y["total"] * 0.9:
                  problems.append(f"{y['year']} fell from {y['total']} to {new['total']}")
              if y.get("orgs") and not new.get("orgs"):
                  problems.append(f"{y['year']} lost its organisations")
          # Each year's day cells must add up to (about) its total, so a
          # calendar with blanked days but intact totals is caught too.
          for y in d["years"]:
              days = sum(c[0] for c in y["days"])
              if abs(days - y["total"]) > max(5, y["total"] * 0.02):
                  problems.append(f"{y['year']} days add up to {days}, total says {y['total']}")
          if problems:
              print("The new data looks wrong:", *problems, sep="\n  ")
              if os.environ.get("ALLOW_DROP") != "true":
                  sys.exit("Refusing to commit. If the drop is real, re-run with allow_drop.")
              print("allow_drop is set, committing anyway.")
          print(f"OK: {d['total_text']} contributions, {d['first_year']}-{d['last_year']}"
                f" (was {old['total_text']})")
          EOF
          git diff --stat

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/contributions.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh contributions data ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          exit 1

      - name: Keep this scheduled workflow enabled
        if: always()
        # The data is already pushed by now; a hiccup here should not mark
        # the run failed or open a failure issue.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/refresh-contributions.yml/enable"

      - name: Report failure
        # cancelled() covers hitting timeout-minutes, which is not a failure().
        if: failure() || cancelled()
        uses: actions/github-script@v8
        with:
          script: |
            const label = 'contributions-refresh';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The monthly contributions data refresh failed: ${runUrl}\n\n` +
              `The /contributions/ page keeps showing the previous snapshot until a run succeeds. ` +
              `Re-run it from the Actions tab ("Refresh Contributions Data" → "Run workflow") once fixed.`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Monthly contributions data refresh failed',
                body, labels: [label],
              });
            }

      - name: Close the failure issue
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'contributions-refresh',
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Fixed: this run succeeded and refreshed the data. ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
            }
