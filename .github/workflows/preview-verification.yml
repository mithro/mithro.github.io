# Preview Site Verification
# Builds the PR's site, serves the build locally and link-checks it with
# muffet, then posts the report as a PR comment.
#
# Two kinds of failure are kept apart:
# - Internal links and assets (pages and files of this build) are checked
#   against the local server, so the result does not depend on GitHub
#   Pages timing on preview.mith.ro. Any broken one fails the check.
# - External links are checked too, but many sites block or rate-limit
#   GitHub's datacenter IPs, so they are only reported in the comment.
name: Preview Site Verification

on:
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened]

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to verify'
        required: true

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_ORIGIN: https://preview.mith.ro
  LOCAL_ORIGIN: http://localhost:4000
  MUFFET_VERSION: v2.11.8

# A newer push to the same PR supersedes the run for the older commit.
concurrency:
  group: preview-verification-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR number
        id: pr-info
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "preview_url=${PREVIEW_ORIGIN}/pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # pull_request runs check out the merge commit by default; a
          # manual run checks out the PR's head.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', steps.pr-info.outputs.pr_number) || '' }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site for the local server
        run: |
          # Point absolute_url links (canonical, og:image, feed) at the
          # local server so they are checked as part of this build.
          printf 'url: "%s"\n' "$LOCAL_ORIGIN" > "$RUNNER_TEMP/local-url.yml"
          bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/local-url.yml" --baseurl "" --future
        env:
          JEKYLL_ENV: production
          LANG: C.UTF-8
          LC_ALL: C.UTF-8

      - name: Install muffet
        run: |
          wget -qO- "https://github.com/raviqqe/muffet/releases/download/${MUFFET_VERSION}/muffet_linux_amd64.tar.gz" | tar -xzf - -C /tmp
          sudo mv /tmp/muffet /usr/local/bin/
          muffet --version

      - name: Serve the build locally
        run: |
          python3 -m http.server 4000 --bind 127.0.0.1 --directory _site > "$RUNNER_TEMP/http.log" 2>&1 &
          for i in {1..30}; do
            curl -sf -o /dev/null "$LOCAL_ORIGIN/" && exit 0
            sleep 1
          done
          echo "Local server did not start"
          cat "$RUNNER_TEMP/http.log"
          exit 1

      - name: Link check the build
        id: verification
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          PREVIEW_URL="${{ steps.pr-info.outputs.preview_url }}"

          REPORT_FILE="verification-report.md"
          echo "**PR:** #$PR_NUMBER" > $REPORT_FILE
          echo "**Preview:** $PREVIEW_URL/" >> $REPORT_FILE
          echo "" >> $REPORT_FILE

          # Excluded external domains answer automated clients on GitHub's
          # runners with errors whatever the link (see .github/PREVIEWS.md):
          # they block bots outright (LinkedIn, ACM/DOI, IEEE, Google
          # Docs/Drive/Scholar, Twitter/X, Mastodon, Crowd Supply),
          # rate-limit (web.archive.org, Google's blogs), refuse
          # connections from outside their country (tsri.org.tw), or
          # chain-redirect into one of these (bit.ly).
          # muffet exits non-zero whenever any link fails; the split below
          # decides whether the check fails.
          muffet \
            --format=json \
            --timeout=30 \
            --max-connections=10 \
            --max-connections-per-host=5 \
            --rate-limit=20 \
            --max-retries=3 \
            --buffer-size=16384 \
            --max-response-body-size=33554432 \
            --exclude=".*mailto:.*" \
            --exclude=".*linkedin\.com.*" \
            --exclude=".*docs\.google\.com.*" \
            --exclude=".*drive\.google\.com.*" \
            --exclude=".*doi\.org.*" \
            --exclude=".*dl\.acm\.org.*" \
            --exclude=".*ieeexplore\.ieee\.org.*" \
            --exclude=".*electronics-lab\.com.*" \
            --exclude=".*bit\.ly.*" \
            --exclude=".*scholar\.google\.com.*" \
            --exclude="^https?://([a-z0-9-]+\.)?twitter\.com.*" \
            --exclude="^https?://(www\.)?x\.com.*" \
            --exclude="^https?://fosstodon\.org.*" \
            --exclude="^https?://(www\.)?crowdsupply\.com.*" \
            --exclude="^https?://web\.archive\.org.*" \
            --exclude="^https?://opensource\.googleblog\.com.*" \
            --exclude="^https?://(www\.)?tsri\.org\.tw.*" \
            --header="User-Agent:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            --header="Accept:text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            --header="Accept-Language:en-US,en;q=0.9" \
            "$LOCAL_ORIGIN/" > muffet-report.json 2> muffet-stderr.txt || true

          if [ -s muffet-stderr.txt ]; then
            echo "muffet stderr:"
            cat muffet-stderr.txt
          fi
          # muffet prints nothing on stdout when every link passes, and an
          # error message on stderr when the crawl itself could not run.
          if [ ! -s muffet-report.json ] && grep -q . muffet-stderr.txt; then
            echo "muffet failed to run"
            exit 1
          fi

          python3 .github/scripts/link-report.py muffet-report.json \
            --origin "$LOCAL_ORIGIN" \
            --display-origin "$PREVIEW_URL" \
            --out "$REPORT_FILE" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/counts.txt"
          cat "$RUNNER_TEMP/counts.txt"

          if grep -q '^internal_failures=0$' "$RUNNER_TEMP/counts.txt"; then
            echo "verification_status=success" >> $GITHUB_OUTPUT
          else
            echo "verification_status=failed" >> $GITHUB_OUTPUT
          fi

          # Keep the PR comment under GitHub's 65,536-character limit.
          REPORT=$(head -c 60000 $REPORT_FILE)
          echo "report_content<<REPORT_EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "REPORT_EOF" >> $GITHUB_OUTPUT

          cat $REPORT_FILE

      - name: Comment verification results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          VERIFICATION_STATUS: ${{ steps.verification.outputs.verification_status }}
          REPORT_CONTENT: ${{ steps.verification.outputs.report_content }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const commentVerificationResults = require('./.github/scripts/comment-verification-results.js');
            const result = await commentVerificationResults(github, context, core);
            console.log(`Comment ID: ${result.commentId}, Archived: ${result.archivedCount} previous comments`);

      - name: Fail workflow if internal links are broken
        if: steps.verification.outputs.verification_status == 'failed'
        run: |
          echo "Broken internal links or assets found; see the report above."
          exit 1
