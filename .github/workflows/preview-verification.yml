# Preview Site Verification
# Waits for the PR preview deployment (published by pr-preview.yml) to
# serve the expected commit, then link-checks the deployed preview with
# muffet and posts the report as a PR comment. The crawl runs against
# preview.mith.ro so it checks exactly what a reviewer will see,
# including the /pr-<N> baseurl.
#
# Two kinds of failure are kept apart:
# - Internal links and assets (anything on the preview host or mith.ro)
#   fail the check when broken. GitHub Pages can answer 503 while it
#   redeploys the preview host for another PR, so the crawl is repeated
#   while internal failures look temporary.
# - External links are checked too, but many sites block or rate-limit
#   GitHub's datacenter IPs, so they are only reported in the comment.
name: Preview Site Verification

on:
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened]

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to verify'
        required: true

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_ORIGIN: https://preview.mith.ro
  MUFFET_VERSION: v2.11.8

# A newer push to the same PR supersedes the run for the older commit.
# Manual runs are grouped apart so they do not cancel the PR's own check.
concurrency:
  group: preview-verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Only the scripts in .github/ are needed; nothing pushes.
          persist-credentials: false

      - name: Get PR information
        id: pr-info
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.PR_NUMBER || '')) {
              core.setFailed(`Invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const previewUrl = `${process.env.PREVIEW_ORIGIN}/pr-${prNumber}`;

            // The preview must serve the PR's current head commit, which
            // a manual run does not have in its event payload.
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            console.log(`PR #${prNumber}: ${pullRequest.title}`);
            console.log(`Preview URL: ${previewUrl}/`);
            console.log(`HEAD: ${pullRequest.head.sha}`);

            core.setOutput('pr_number', prNumber);
            core.setOutput('preview_url', previewUrl);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Wait for preview deployment to complete
        env:
          PREVIEW_URL: ${{ steps.pr-info.outputs.preview_url }}
          EXPECTED_COMMIT: ${{ steps.pr-info.outputs.head_sha }}
        run: |
          echo "Waiting for $PREVIEW_URL/ to serve commit $EXPECTED_COMMIT"

          for i in {1..180}; do
            PAGE_CONTENT=$(curl -s --max-time 20 "$PREVIEW_URL/" || echo "")
            FOUND_COMMIT=$(echo "$PAGE_CONTENT" | grep -oE '<meta name="git-commit" content="[a-f0-9]{40}"' | grep -oE '[a-f0-9]{40}' || echo "")

            if [ "$FOUND_COMMIT" = "$EXPECTED_COMMIT" ]; then
              echo "✅ Preview serves the expected commit"
              exit 0
            fi

            echo "Attempt $i/180: found '${FOUND_COMMIT:-nothing}', waiting..."
            sleep 5
          done

          echo "ERROR: Preview not ready with correct commit after 15 minutes"
          exit 1

      - name: Install muffet
        run: |
          wget -qO- "https://github.com/raviqqe/muffet/releases/download/${MUFFET_VERSION}/muffet_linux_amd64.tar.gz" | tar -xzf - -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/muffet" /usr/local/bin/
          muffet --version

      - name: Link check the deployed preview
        id: verification
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.pr-info.outputs.preview_url }}
          MAX_ATTEMPTS: 3
        run: |
          REPORT_FILE="verification-report.md"
          COUNTS_FILE="$RUNNER_TEMP/counts.txt"

          # Excluded external domains answer automated clients on GitHub's
          # runners with errors whatever the link (see .github/PREVIEWS.md):
          # they block bots outright (LinkedIn, ACM/DOI, IEEE, Google
          # Docs/Drive/Scholar, Twitter/X, Mastodon, Crowd Supply),
          # rate-limit (web.archive.org, Google's blogs), refuse
          # connections from outside their country (tsri.org.tw), or
          # chain-redirect into one of these (bit.ly).
          # The last exclude is the preview host's front page, which lists
          # every open PR's preview: muffet follows links to any page on
          # the crawled host, so without it one stray link would pull all
          # the other previews into this crawl.
          # muffet exits non-zero whenever any link fails; link-report.py
          # decides whether the check fails.
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Crawl attempt $attempt of $MAX_ATTEMPTS"
            muffet_rc=0
            muffet \
              --format=json \
              --timeout=30 \
              --max-connections=10 \
              --max-connections-per-host=5 \
              --rate-limit=20 \
              --max-retries=3 \
              --buffer-size=16384 \
              --max-response-body-size=33554432 \
              --exclude="^https?://([a-z0-9-]+\.)*linkedin\.com([/?#].*)?$" \
              --exclude="^https?://([a-z0-9-]+\.)*docs\.google\.com([/?#].*)?$" \
              --exclude="^https?://([a-z0-9-]+\.)*drive\.google\.com([/?#].*)?$" \
              --exclude="^https?://([a-z0-9-]+\.)*doi\.org([/?#].*)?$" \
              --exclude="^https?://([a-z0-9-]+\.)*dl\.acm\.org([/?#].*)?$" \
              --exclude="^https?://([a-z0-9-]+\.)*ieeexplore\.ieee\.org([/?#].*)?$" \
              --exclude="^https?://([a-z0-9-]+\.)*electronics-lab\.com([/?#].*)?$" \
              --exclude="^https?://([a-z0-9-]+\.)*bit\.ly([/?#].*)?$" \
              --exclude="^https?://([a-z0-9-]+\.)*scholar\.google\.com([/?#].*)?$" \
              --exclude="^https?://([a-z0-9-]+\.)?twitter\.com([/?#].*)?$" \
              --exclude="^https?://(www\.)?x\.com([/?#].*)?$" \
              --exclude="^https?://fosstodon\.org([/?#].*)?$" \
              --exclude="^https?://(www\.)?crowdsupply\.com([/?#].*)?$" \
              --exclude="^https?://web\.archive\.org([/?#].*)?$" \
              --exclude="^https?://opensource\.googleblog\.com([/?#].*)?$" \
              --exclude="^https?://(www\.)?tsri\.org\.tw([/?#].*)?$" \
              --exclude="^${PREVIEW_ORIGIN}/?$" \
              --header="User-Agent:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
              --header="Accept:text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
              --header="Accept-Language:en-US,en;q=0.9" \
              "$PREVIEW_URL/" > muffet-report.json 2> muffet-stderr.txt || muffet_rc=$?

            if [ -s muffet-stderr.txt ]; then
              echo "muffet stderr:"
              cat muffet-stderr.txt
            fi

            # muffet prints "[]" when every link passes. It prints an error
            # on stderr, and no JSON, when the crawl itself could not run
            # (for example the preview's front page answered 503). A
            # non-zero exit with no JSON means the same even if stderr is
            # empty.
            crawl_failed=false
            if [ ! -s muffet-report.json ] && { [ "$muffet_rc" -ne 0 ] || [ -s muffet-stderr.txt ]; }; then
              crawl_failed=true
              echo "muffet failed to run (exit $muffet_rc)"
            else
              {
                echo "**PR:** #$PR_NUMBER"
                echo "**Preview:** $PREVIEW_URL/"
                if [ "$attempt" -gt 1 ]; then
                  echo "**Crawl attempts:** $attempt (earlier ones hit temporary errors on the preview host)"
                fi
                echo ""
              } > "$REPORT_FILE"

              # A link to anywhere on the preview host counts as internal,
              # not just to /pr-<N>/: one written without relative_url
              # lands at the host root and must fail. So do the site's
              # hard-coded absolute links to production. Only pages of
              # this PR's preview are reported, so another PR's broken
              # preview cannot fail this check.
              python3 .github/scripts/link-report.py muffet-report.json \
                --origin "$PREVIEW_ORIGIN" \
                --internal-origin "https://mith.ro" \
                --internal-origin "https://www.mith.ro" \
                --page-prefix "$PREVIEW_URL/" \
                --max-chars 60000 \
                --out "$REPORT_FILE" > "$COUNTS_FILE"
              cat "$COUNTS_FILE"
            fi
            echo "::endgroup::"

            if [ "$crawl_failed" = false ] && grep -q '^internal_transient=0$' "$COUNTS_FILE"; then
              break
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Temporary errors on the preview host; crawling again in 60 seconds"
              sleep 60
            fi
          done

          if [ "$crawl_failed" = true ]; then
            # Still report on the PR, so an older "passed" comment is not
            # left standing as the latest result.
            {
              echo "**PR:** #$PR_NUMBER"
              echo "**Preview:** $PREVIEW_URL/"
              echo ""
              echo "## ❌ The link checker could not crawl the preview"
              echo ""
              echo "muffet exited with status $muffet_rc on each of $MAX_ATTEMPTS attempts and reported no links."
              echo ""
              echo '```'
              head -c 2000 muffet-stderr.txt | tr -d '`' | tr -c '[:print:]\n' ' '
              echo ""
              echo '```'
            } > "$REPORT_FILE"
            echo "verification_status=failed" >> "$GITHUB_OUTPUT"
          elif grep -q '^internal_failures=0$' "$COUNTS_FILE"; then
            cat "$COUNTS_FILE" >> "$GITHUB_OUTPUT"
            echo "verification_status=success" >> "$GITHUB_OUTPUT"
          else
            cat "$COUNTS_FILE" >> "$GITHUB_OUTPUT"
            echo "verification_status=failed" >> "$GITHUB_OUTPUT"
          fi

          # link-report.py already cut the report at a line boundary to
          # keep the PR comment under GitHub's 65,536-character limit.
          # The delimiter is random so no line of the report can end the
          # value early.
          DELIMITER="REPORT_$(openssl rand -hex 16)"
          {
            echo "report_content<<$DELIMITER"
            cat "$REPORT_FILE"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          cat "$REPORT_FILE"

      - name: Comment verification results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          VERIFICATION_STATUS: ${{ steps.verification.outputs.verification_status }}
          REPORT_CONTENT: ${{ steps.verification.outputs.report_content }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const commentVerificationResults = require('./.github/scripts/comment-verification-results.js');
            const result = await commentVerificationResults(github, context, core);
            console.log(`Comment ID: ${result.commentId}, Archived: ${result.archivedCount} previous comments`);

      - name: Fail workflow if internal links are broken
        if: steps.verification.outputs.verification_status == 'failed'
        run: |
          echo "Broken internal links or assets found; see the report above."
          exit 1
