# Preview Site Verification
# Link-checks the PR preview that pr-preview.yml publishes, as deployed
# on preview.mith.ro, so it checks exactly what a reviewer will see,
# including the /pr-<N> baseurl. See .github/PREVIEWS.md.
#
# verify-preview waits until the preview serves the PR's head commit
# (the git-commit hash in the pages), crawls it with muffet and posts
# the report as a PR comment as soon as it has one.
# - Internal links and assets (anything on the preview host or mith.ro)
#   fail the check when broken, and so does any link that leaves
#   /pr-<N>/ for another part of the preview host.
# - External links are checked too. One that is dead (404, 410 or a
#   domain that no longer resolves, confirmed by asking again) fails the
#   check. Other errors are what sites blocking or rate-limiting
#   GitHub's datacenter IPs look like, so they are only reported.
#
# sanity-check runs afterwards without holding up that result. It waits
# out the CDN's maximum cache time, crawls again and checks that it gets
# the same answer, which shows the first crawl was not fed cached pages
# of an earlier deployment.
name: Preview Site Verification

on:
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened]

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to verify'
        required: true

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_ORIGIN: https://preview.mith.ro

# A newer push to the same PR supersedes the run for the older commit.
# Manual runs are grouped apart so they do not cancel the PR's own check.
concurrency:
  group: preview-verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    # Worst case: 15 min waiting for the deployment, then three crawls
    # of up to ~8 min each with a minute between them.
    timeout-minutes: 60
    outputs:
      pr_number: ${{ steps.pr-info.outputs.pr_number }}
      preview_url: ${{ steps.pr-info.outputs.preview_url }}
      head_sha: ${{ steps.pr-info.outputs.head_sha }}
      ready_at: ${{ steps.wait.outputs.ready_at }}
      max_age: ${{ steps.wait.outputs.max_age }}
      have_result: ${{ steps.verification.outputs.have_result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Only the scripts in .github/ are needed; nothing pushes.
          persist-credentials: false

      - name: Get PR information
        id: pr-info
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.PR_NUMBER || '')) {
              core.setFailed(`Invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const previewUrl = `${process.env.PREVIEW_ORIGIN}/pr-${prNumber}/`;

            // The preview must serve the PR's current head commit, which
            // a manual run does not have in its event payload.
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            console.log(`PR #${prNumber}: ${pullRequest.title}`);
            console.log(`Preview URL: ${previewUrl}`);
            console.log(`HEAD: ${pullRequest.head.sha}`);

            core.setOutput('pr_number', prNumber);
            core.setOutput('preview_url', previewUrl);
            core.setOutput('head_sha', pullRequest.head.sha);

      # The deployment is published once the pages carry this commit's
      # hash: the front page and every page in the sitemap must show it.
      - name: Wait for the preview to serve this commit
        id: wait
        env:
          PREVIEW_URL: ${{ steps.pr-info.outputs.preview_url }}
          EXPECTED_COMMIT: ${{ steps.pr-info.outputs.head_sha }}
        run: |
          python3 .github/scripts/check-preview-commit.py \
            --preview-url "$PREVIEW_URL" \
            --commit "$EXPECTED_COMMIT" \
            --wait 900 \
            --github-output "$GITHUB_OUTPUT"

      - name: Install muffet
        run: |
          wget -qO- https://github.com/raviqqe/muffet/releases/latest/download/muffet_linux_amd64.tar.gz | tar -xzf - -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/muffet" /usr/local/bin/
          muffet --version

      - name: Link check the deployed preview
        id: verification
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.pr-info.outputs.preview_url }}
          EXPECTED_COMMIT: ${{ steps.pr-info.outputs.head_sha }}
        run: |
          python3 .github/scripts/crawl-preview.py \
            --preview-origin "$PREVIEW_ORIGIN" \
            --preview-url "$PREVIEW_URL" \
            --pr-number "$PR_NUMBER" \
            --commit "$EXPECTED_COMMIT" \
            --out-dir "$RUNNER_TEMP/linkcheck" \
            --github-output "$GITHUB_OUTPUT"

      - name: Comment verification results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          VERIFICATION_STATUS: ${{ steps.verification.outputs.verification_status }}
          REPORT_CONTENT: ${{ steps.verification.outputs.report_content }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const commentVerificationResults = require('./.github/scripts/comment-verification-results.js');
            const result = await commentVerificationResults(github, context, core);
            console.log(`Comment ID: ${result.commentId}, Archived: ${result.archivedCount} previous comments`);

      # The wait for the deployment timing out, or any other step failing
      # before a result exists, must not leave an older "passed" comment
      # standing as the latest word on the PR.
      - name: Comment that verification could not run
        if: failure() && github.event_name == 'pull_request' && steps.verification.outputs.verification_status == ''
        uses: actions/github-script@v8
        env:
          VERIFICATION_STATUS: failed
          REPORT_CONTENT: |
            ## ❌ The link check did not run to completion

            The preview may never have served this commit, or the checker itself failed, so no links were checked. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const commentVerificationResults = require('./.github/scripts/comment-verification-results.js');
            await commentVerificationResults(github, context, core);

      # For sanity-check to compare its own crawl against.
      - name: Keep the crawl result
        if: always() && steps.verification.outputs.have_result == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: first-crawl
          path: ${{ runner.temp }}/linkcheck/
          retention-days: 7

      - name: Fail workflow if links are broken
        if: steps.verification.outputs.verification_status == 'failed'
        run: |
          echo "Broken internal links or dead external links found; see the report above."
          exit 1

  # GitHub Pages serves every URL with Cache-Control: max-age=600, so
  # for up to ten minutes after a deployment the CDN may still hand out
  # a copy of a page from the deployment before. verify-preview guards
  # against that by checking the commit hash in the pages; this job
  # confirms it after the fact, once no such copy can be left. It is a
  # separate job so that the result above is published without waiting.
  sanity-check:
    needs: verify-preview
    # Also after a failed link check: the failures should be the same.
    if: ${{ !cancelled() && needs.verify-preview.outputs.have_result == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PR_NUMBER: ${{ needs.verify-preview.outputs.pr_number }}
      PREVIEW_URL: ${{ needs.verify-preview.outputs.preview_url }}
      EXPECTED_COMMIT: ${{ needs.verify-preview.outputs.head_sha }}
      READY_AT: ${{ needs.verify-preview.outputs.ready_at }}
      MAX_AGE: ${{ needs.verify-preview.outputs.max_age }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Wait out the maximum cache time
        run: |
          # A minute more than max-age after the preview was first seen
          # serving this commit.
          WAIT=$((READY_AT + MAX_AGE + 60 - $(date +%s)))
          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting ${WAIT}s (max-age=${MAX_AGE}s)"
            sleep "$WAIT"
          fi

      - name: Fetch the first crawl's result
        uses: actions/download-artifact@v4
        with:
          name: first-crawl
          path: ${{ runner.temp }}/first-crawl

      - name: Install muffet
        run: |
          wget -qO- https://github.com/raviqqe/muffet/releases/latest/download/muffet_linux_amd64.tar.gz | tar -xzf - -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/muffet" /usr/local/bin/
          muffet --version

      # A newer deployment would have cancelled this run, so the preview
      # must still be serving the same commit.
      - name: Crawl the preview again
        id: second
        run: |
          python3 .github/scripts/crawl-preview.py \
            --preview-origin "$PREVIEW_ORIGIN" \
            --preview-url "$PREVIEW_URL" \
            --pr-number "$PR_NUMBER" \
            --commit "$EXPECTED_COMMIT" \
            --label "sanity check, after the maximum cache time" \
            --out-dir "$RUNNER_TEMP/second-crawl" \
            --github-output "$GITHUB_OUTPUT"

      - name: Compare the two crawls
        id: compare
        env:
          HAVE_RESULT: ${{ steps.second.outputs.have_result }}
        run: |
          SUMMARY="$RUNNER_TEMP/sanity.md"
          status=0
          if [ "$HAVE_RESULT" = "true" ]; then
            python3 .github/scripts/compare-link-results.py \
              "$RUNNER_TEMP/first-crawl/result.json" \
              "$RUNNER_TEMP/second-crawl/result.json" \
              --out "$SUMMARY" || status=$?
          else
            status=1
            {
              echo "## ❌ The later crawl could not be completed"
              echo ""
              echo "So the first crawl's result could not be cross-checked. Its own report:"
              echo ""
              cat "$RUNNER_TEMP/second-crawl/verification-report.md"
            } > "$SUMMARY"
          fi
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "agree=false" >> "$GITHUB_OUTPUT"
          else
            echo "agree=true" >> "$GITHUB_OUTPUT"
          fi

      # Agreement is only shown as this job passing; a disagreement is
      # worth a comment because the earlier one can no longer be trusted.
      - name: Comment on the PR when the crawls disagree
        if: steps.compare.outputs.agree == 'false' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          SUMMARY_FILE: ${{ runner.temp }}/sanity.md
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8').slice(0, 60000);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER, 10),
              body: [
                '# ⚠️ Link check sanity check',
                '',
                `Commit \`${process.env.EXPECTED_COMMIT}\`, crawled again after the maximum cache time.`,
                '',
                summary,
                '',
                '---',
                `<sub>🔁 [Workflow run](${runUrl})</sub>`
              ].join('\n')
            });

      - name: Fail if the crawls disagree
        if: steps.compare.outputs.agree == 'false'
        run: |
          echo "The later crawl did not confirm the first one; see the job summary."
          exit 1
