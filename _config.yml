title: "Tim 'mithro' Ansell"
description: "Building open source silicon ecosystems — SKY130 & GF180MCU PDKs, Open MPW, wafer.space."
url: "https://mith.ro"
lang: en

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# One detail page per talk. The stubs in _talks/ are generated by
# scripts/gen_talk_pages.py (front matter only); _layouts/talk.html
# renders everything from _data/talks.yaml.
# One detail page per topic; stubs in _topics/ come from
# scripts/gen_topic_pages.py and _layouts/topic.html renders them.
collections:
  talks:
    output: true
    permalink: /talks/:slug/
  topics:
    output: true
    permalink: /talks/topics/:slug/

defaults:
  - scope: { path: "", type: talks }
    values: { layout: talk }
  - scope: { path: "", type: topics }
    values: { layout: topic }

# Jekyll drops underscore-prefixed files by default; YouTube video ids
# can start with an underscore, so force those thumbnails in.
include:
  - _7jSh04LzhA-320.webp
  - _7jSh04LzhA-640.webp
  - .well-known

# Redirect stubs are generated files; everything else is hand-written.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - docs/
  - scripts/
  - tmp/
  - vendor/
