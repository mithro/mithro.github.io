title: "Tim 'mithro' Ansell"
description: "Building open source silicon ecosystems — SKY130 & GF180MCU PDKs, Open MPW, wafer.space."
url: "https://mith.ro"
lang: en

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# One page per talk and per topic. The stubs in _talks/ and _topics/ are
# front matter only, generated by scripts/gen_talk_pages.py and
# scripts/gen_topic_pages.py; _layouts/talk.html and _layouts/topic.html
# render everything from _data/talks.yaml and _data/talk_categories.yaml.
collections:
  talks:
    output: true
    permalink: /talks/:slug/
  topics:
    output: true
    permalink: /talks/topics/:slug/

defaults:
  - scope: { path: "", type: talks }
    values: { layout: talk }
  - scope: { path: "", type: topics }
    values: { layout: topic }

# Jekyll drops files whose names start with "_" or "."; YouTube video ids
# can start with an underscore, so every such thumbnail is let back in by
# pattern (a fixed list would silently drop the next one). .well-known
# holds the Keybase proof.
include:
  - "_*.webp"
  - .well-known

# Tooling and sources that are not part of the site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - docs/
  - scripts/
  - tmp/
  - vendor/
